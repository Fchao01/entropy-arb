# 溢价低位开仓、回升平仓；分位数和规模为配置示例，不保证可覆盖交易成本。
# RH 主腿 + Arcus 对冲。先用 --record-only 采集；阈值是示例，须重新测量。
# Arcus 手续费按你提供的 0.0225% 填为 2.25 bps；RH 费率也应核对账户。
# 两边品种名称不同时分别添加 primary.symbol / hedge.symbol。
strategy:
  mode: bps
bps:
  levels: rolling
  direction: long_primary
  window_minutes: 120
  min_valid_minutes: 30   # 允许缺口；最近窗口内至少 30 条，窗口不足 30 分钟时要求填满
  entry_percentile: 10
  exit_percentile: 75
  max_entries: 1
  add_interval_sec: 60
  max_position_usd: 1000
thresholds:
  midline_bps: 0.0
  upper_bps: 4.0
  lower_bps: 4.0
primary:
  venue: lighter-rh
  taker_fee_bps: 0.0
  max_position_usd: 1000
  max_orders_per_min: 30
hedge:
  taker_fee_bps: 2.25
  max_position_usd: 1000
  max_orders_per_min: 30
arcus:
  network: mainnet
sizing:
  take_fraction: 0.5
  max_order_notional_usd: 500
  min_order_notional_usd: 10
inventory:
  scale_bps: 10.0
  floor_frac: 0
execution:
  max_ws_delay_ms: 100.0    # publication-to-receive delay / WS 接收延迟；0 关闭
  max_ws_age_ms: 100.0      # book age before opening / 盘口年龄保护；0 关闭
  primary_order_type: taker   # taker 吃单 / maker 买一卖一只挂单
  maker_timeout_sec: 5.0      # 挂单最长等待秒数，范围 (0, 60]
  premium_persist_sec: 0
  cooldown_sec: 0.0
  settle_timeout_sec: 10.0
  leg_slippage_bps: 50.0
  hedge_slippage_bps: 20.0
  net_tolerance_base: 0.001
  max_consecutive_errors: 3
  rate_limit_pause_sec: 10.0
  staleness_sec: 10.0
  reconcile_sec: 15.0
  venue_probe_sec: 30.0
  http_keepalive_sec: 10.0
recorder:
  enabled: true
  csv: logs/{primary}-{hedge}/{symbol}/minutes.csv
logging:
  level: INFO
  status_interval_sec: 30.0
  trades_csv: logs/{primary}-{hedge}/{symbol}/trades.csv
  dashboard: true
  file: logs/{primary}-{hedge}/{symbol}/engine.log
